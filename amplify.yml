version: 1
backend:
  phases:
    build:
      commands:
        # `npm install` instead of `npm ci`: npm 10.9 mis-records a bundled
        # OpenTelemetry copy inside @aws-amplify/data-construct, which makes
        # `npm ci` refuse an otherwise complete lockfile.
        - npm install --no-audit --no-fund --prefer-offline --cache .npm
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
